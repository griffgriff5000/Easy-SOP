[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-capture-studio"
version = "0.1.0"
description = "Local Windows procedure capture and documentation"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13", "reportlab>=4.2,<5", "python-docx>=1.2,<2", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=5,<7", "pyinstaller>=6,<7"]

[project.gui-scripts]
sop-capture-studio = "sop_capture.app:main"

[tool.setuptools.packages.find]
include = ["sop_capture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
