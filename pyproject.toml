[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-capture-studio"
version = "0.3.1"
description = "Local Windows procedure capture and documentation"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "Pillow>=11,<13", "reportlab>=4.2,<5", "python-docx>=1.2,<2", "pdfplumber>=0.11,<0.12", "pywin32>=308; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=5,<7", "pyinstaller>=6,<7"]

[project.gui-scripts]
sop-capture-studio = "sop_capture.app:main"

[tool.setuptools.packages.find]
include = ["sop_capture*"]

[tool.setuptools.package-data]
sop_capture = ["assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
